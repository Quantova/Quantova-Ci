[rust]
unsafe_code = "deny"
missing_docs = "warn"

[clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = "warn"
float_arithmetic = "deny"
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
