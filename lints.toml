[rust]
unsafe_code = "deny"          # any exception is a documented, reviewed spec decision
missing_docs = "warn"

[clippy]
all = "deny"
pedantic = "warn"
float_arithmetic = "deny"     # no floats in consensus/gas/state paths
integer_arithmetic = "warn"   # prefer checked/saturating in metered paths
