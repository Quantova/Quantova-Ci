name: fuzz

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Detect fuzz targets
        id: guard
        run: |
          if compgen -G "fuzz/fuzz_targets/*.rs" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: steps.guard.outputs.present == 'true'
        with:
          toolchain: nightly
      - name: Install cargo fuzz
        if: steps.guard.outputs.present == 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run every fuzz target
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for target_path in fuzz/fuzz_targets/*.rs; do
            target="$(basename "$target_path" .rs)"
            echo "::group::fuzz target $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -max_len=4096
            echo "::endgroup::"
          done
