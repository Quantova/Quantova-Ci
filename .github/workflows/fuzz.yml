name: fuzz

# Reusable fuzz gate imported by the repository that implements the bridge
# Airlock and the repository that implements the Q-Oracle message parser:
#   jobs:
#     fuzz:
#       uses: Quantova/Quantova-Ci/.github/workflows/fuzz.yml@main
# Every artifact these two parsers accept crosses a trust boundary from
# outside the chain, an Airlock submission arrives from a foreign chain, a
# Q-Oracle report arrives from off chain. A fuzz target for each proves two
# properties against random and mutated input: the parser never panics, and
# it rejects every artifact that is not a genuine Quantova artifact. See
# fixtures/fuzz/bridge-message-parsers for the pattern a fuzz target follows
# and docs/fuzz.md for how a repository adopts this gate. No repo merges a
# change to either parser while this is red.

on:
  workflow_call:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect fuzz targets
        id: guard
        run: |
          if compgen -G "fuzz/fuzz_targets/*.rs" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: steps.guard.outputs.present == 'true'
        with:
          toolchain: nightly
      - name: Install cargo fuzz
        if: steps.guard.outputs.present == 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run every fuzz target
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Every file under fuzz/fuzz_targets is one fuzz target, named for the
          # component it parses, airlock or oracle_message by the convention this
          # repository's fixture sets. Each target gets a bounded run so a pull
          # request finishes in reasonable time; continuous fuzzing beyond this
          # bound is a separate concern from this per-change gate. A crash, whether
          # a panic or the target's own assertion that a foreign artifact must be
          # rejected, exits nonzero and cargo fuzz prints the failing input and
          # where it saved it.
          for target_path in fuzz/fuzz_targets/*.rs; do
            target="$(basename "$target_path" .rs)"
            echo "::group::fuzz target $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -max_len=4096
            echo "::endgroup::"
          done
