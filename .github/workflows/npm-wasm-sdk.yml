name: npm-wasm-sdk

on:
  workflow_call:
    inputs:
      native-dir:
        type: string
        required: false
        default: "native"
      wasm-dir:
        type: string
        required: false
        default: "wasm"
      build-script:
        type: string
        required: false
        default: "native/build.sh"
      rust-toolchain:
        type: string
        required: false
        default: "1.98.0"
      wasm-pack-version:
        type: string
        required: false
        default: "0.15.0"
      binaryen-version:
        type: string
        required: false
        default: "130"
      binaryen-sha256:
        type: string
        required: false
        default: "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc"
      node-version:
        type: string
        required: false
        default: "20"
      test-command:
        type: string
        required: false
        default: "npm test"
      test-node-versions:
        type: string
        required: false
        default: '["20", "22", "24"]'
      pack-allowlist:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  reproduce-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: npm-wasm-sdk-reproduce-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gl.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Secret scan over full history
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          title = "quantova secret scan"
          [extend]
          useDefault = true
          [allowlist]
          description = "public, example, and checksum data that is not a secret"
          paths = [
            '''(^|/)Cargo\.lock$''',
            '''(^|/)package-lock\.json$''',
          ]
          regexes = [
            '''YOUR_[A-Z0-9_]+''',
            '''^[Qq]1[0-9A-Za-z]{25,}$''',
          ]
          TOML
          gitleaks detect --source . --no-banner --redact --config "$RUNNER_TEMP/gitleaks.toml"
      - name: Rust toolchain
        if: inputs.native-dir != ''
        shell: bash
        env:
          NATIVE_DIR: ${{ inputs.native-dir }}
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ] || [ -f "$NATIVE_DIR/rust-toolchain.toml" ] || [ -f "$NATIVE_DIR/rust-toolchain" ]; then
            cd "$NATIVE_DIR"
            rustup toolchain install
            rustup target add wasm32-unknown-unknown
          else
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          fi
      - name: Pinned binaryen
        if: inputs.native-dir != ''
        shell: bash
        env:
          BINARYEN_VERSION: ${{ inputs.binaryen-version }}
          BINARYEN_SHA256: ${{ inputs.binaryen-sha256 }}
        run: |
          set -euo pipefail
          case "$BINARYEN_VERSION" in ''|*[!0-9]*) echo "::error::binaryen-version is a release number such as 130" >&2; exit 1 ;; esac
          case "$BINARYEN_SHA256" in *[!0-9a-f]*) echo "::error::binaryen-sha256 is 64 lowercase hex characters" >&2; exit 1 ;; esac
          [ "${#BINARYEN_SHA256}" = "64" ] || { echo "::error::binaryen-sha256 is 64 lowercase hex characters" >&2; exit 1; }
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o "$archive"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Pinned wasm-pack and wasm-bindgen
        if: inputs.native-dir != ''
        shell: bash
        env:
          NATIVE_DIR: ${{ inputs.native-dir }}
          WASM_PACK_VERSION: ${{ inputs.wasm-pack-version }}
        run: |
          set -euo pipefail
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          bindgen="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' "$NATIVE_DIR/Cargo.lock")"
          if [ -z "$bindgen" ]; then
            echo "::error::$NATIVE_DIR/Cargo.lock does not lock wasm-bindgen" >&2
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
      - name: Rebuild the committed wasm from source
        if: inputs.native-dir != ''
        shell: bash
        env:
          NATIVE_DIR: ${{ inputs.native-dir }}
          WASM_DIR: ${{ inputs.wasm-dir }}
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: |
          set -euo pipefail
          rustc --version
          wasm-opt --version
          wasm-pack --version
          grep -q -- '--locked' "$BUILD_SCRIPT" || { echo "::error::$BUILD_SCRIPT must build with --locked" >&2; exit 1; }
          bash "$BUILD_SCRIPT"
          sha256sum "$WASM_DIR"/*.wasm
          git diff --exit-code -- "$NATIVE_DIR/Cargo.lock"
          if [ -n "$(git status --porcelain --untracked-files=all -- "$WASM_DIR")" ]; then
            git status --porcelain --untracked-files=all -- "$WASM_DIR"
            git diff --stat -- "$WASM_DIR"
            echo "::error::the wasm rebuilt from source differs from the committed $WASM_DIR" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Dependency advisories and registry signatures
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          if ! node -e "const l = require('./package-lock.json'); process.exit(l.lockfileVersion >= 2 ? 0 : 1)"; then
            echo "::error::package-lock.json is lockfile version 1, regenerate it with npm 7 or later so registry signatures can be checked" >&2
            exit 1
          fi
          if node -e "const l = require('./package-lock.json'); process.exit(Object.keys(l.packages || {}).some((k) => k !== '') ? 0 : 1)"; then
            npm audit signatures
          else
            echo "the package has no installed dependencies, so there are no registry signatures to check"
          fi
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
      - name: Package contents
        shell: bash
        env:
          PACK_ALLOWLIST: ${{ inputs.pack-allowlist }}
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            const banned = /(^|\/)(\.env[^/]*|\.npmrc|id_[a-z0-9]+|[^/]*\.(pem|key|p12|pfx|keystore|jks))$/i;
            const allow = process.env.PACK_ALLOWLIST ? new RegExp(process.env.PACK_ALLOWLIST) : null;
            const bad = files.filter((f) => banned.test(f) || (allow && !allow.test(f)));
            for (const f of files) console.log(f);
            if (bad.length) { console.error("::error::the package would publish files it must not: " + bad.join(", ")); process.exit(1); }
          ' "$RUNNER_TEMP/pack.json"
      - name: Software bill of materials
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --omit=dev > "$RUNNER_TEMP/sbom.cdx.json"
          sha256sum "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json

  test-matrix:
    needs: reproduce-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        node: ${{ fromJSON(inputs.test-node-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

  publish:
    needs: [reproduce-and-test, test-matrix]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: npm-wasm-sdk-publish-${{ github.repository }}
      cancel-in-progress: false
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main, refusing to publish it" >&2
            exit 1
          fi
      - name: Tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Install
        run: npm ci --ignore-scripts
      - name: Publish with provenance
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --prefer-online >/dev/null 2>&1; then
            echo "$name@$version is already published, checking its provenance only"
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - name: Published version carries provenance
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            url="$(npm view "$name@$version" dist.attestations.url --prefer-online 2>/dev/null || true)"
            if [ -n "$url" ] && curl -sSfL --retry 3 "$url" -o "$RUNNER_TEMP/attestations.json"; then
              if EXPECTED="$GITHUB_SHA" node -e "
                const all = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).attestations || [];
                const want = process.env.EXPECTED.toLowerCase();
                const ok = all.some((a) => {
                  if (!String(a.predicateType || '').includes('slsa.dev/provenance')) return false;
                  const env = a.bundle && a.bundle.dsseEnvelope;
                  if (!env || !env.payload) return false;
                  const stmt = JSON.parse(Buffer.from(env.payload, 'base64').toString('utf8'));
                  const deps = (stmt.predicate && stmt.predicate.buildDefinition && stmt.predicate.buildDefinition.resolvedDependencies) || [];
                  return deps.some((d) => d.digest && String(d.digest.gitCommit || '').toLowerCase() === want);
                });
                process.exit(ok ? 0 : 1);
              " "$RUNNER_TEMP/attestations.json"; then
                echo "$name@$version carries provenance for commit $GITHUB_SHA"
                exit 0
              fi
              echo "::error::$name@$version carries provenance, but not for commit $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 15
          done
          echo "::error::$name@$version was published without a provenance attestation" >&2
          exit 1
