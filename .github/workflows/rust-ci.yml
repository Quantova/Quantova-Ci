name: rust-ci

# Reusable pipeline imported by every repo:
#   jobs:
#     ci:
#       uses: Quantova/Quantova-Ci/.github/workflows/rust-ci.yml@main
# No repo merges while this is red.

on:
  workflow_call:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect Rust project
        id: guard
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: steps.guard.outputs.rust == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        if: steps.guard.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        if: steps.guard.outputs.rust == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        if: steps.guard.outputs.rust == 'true'
        run: cargo test --all-features

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect Rust project
        id: guard
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: steps.guard.outputs.rust == 'true'
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo llvm-cov
        if: steps.guard.outputs.rust == 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Coverage gate
        if: steps.guard.outputs.rust == 'true'
        # Line coverage below this floor fails the build. Raising or lowering it is
        # a deliberate, reviewable change to this file, the same way a cross repo
        # pin only moves in a reviewable commit. cargo-llvm-cov instruments the same
        # test run the check job already runs, so this measures the real test suite
        # rather than a separate one written to hit a number.
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 70

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Classical-crypto dependency gate
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check bans licenses sources advisories

  symbol-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: ${{ hashFiles('Cargo.toml') != '' }}
        with:
          toolchain: stable
      - name: Build release
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo build --release --all-features
      - name: Classical-crypto symbol scan
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Layer 2 of PQ independence. Signatures of classical primitives, carried inline so the
          # reusable workflow needs nothing from the consuming repository. A repo that ships no
          # executable has nothing to scan and passes.
          patterns='secp256k1|curve25519|ristretto|ed25519|ecdsa|bls12|bn254|EC_POINT|BN_mod_exp|RSA_'
          fail=0
          while IFS= read -r bin; do
            if strings "$bin" | grep -Eiq "$patterns"; then
              echo "::error file=$bin::classical-crypto symbol signature detected in $bin"
              fail=1
            fi
          done < <(find target/release -maxdepth 1 -type f -perm -u+x)
          exit "$fail"

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cross repo pin agreement gate
        shell: bash
        env:
          QTOV_PINS_FILE: cross-repo-pins
          QTOV_LOCK_FILE: Cargo.lock
        run: |
          set -euo pipefail

          # For each cross repo git dependency, the declared pin, the committed
          # lockfile commit, and the remote peeled tag must agree. This job carries
          # its own copy of the checker so the reusable workflow needs nothing from
          # the consuming repository beyond its cross-repo-pins and Cargo.lock.
          # It peels the live remote with git ls-remote. A repository with no
          # cross-repo-pins file exits zero and is left alone.
          python3 - <<'PY'
          import os, re, subprocess, sys

          pins_path = os.environ["QTOV_PINS_FILE"]
          lock_path = os.environ["QTOV_LOCK_FILE"]
          fixture_path = os.environ.get("QTOV_PIN_PEEL_FIXTURE")

          DEFAULT_OWNER = "Quantova"


          def die(msg):
              sys.stderr.write("pin-agreement: %s\n" % msg)
              sys.exit(1)


          def repo_name(value):
              value = value.strip()
              value = re.sub(r"^git\+", "", value)
              value = value.split("?", 1)[0]
              value = re.sub(r"\.git$", "", value)
              return value.rstrip("/").rsplit("/", 1)[-1].lower()


          def owner_slug(declared_repo):
              declared_repo = declared_repo.strip().rstrip("/")
              if "/" in declared_repo:
                  return declared_repo
              return "%s/%s" % (DEFAULT_OWNER, declared_repo)


          def tagged_git_sources(text):
              found = []
              for m in re.finditer(r'source = "git\+([^"]+)"', text):
                  src = m.group(1)
                  if re.search(r"[?&]tag=[^&#]+", src) and re.search(r"#[0-9a-fA-F]{7,40}$", src):
                      found.append(src)
              return found


          if not os.path.isfile(pins_path):
              if os.path.isfile(lock_path):
                  with open(lock_path, encoding="utf-8") as fh:
                      if tagged_git_sources(fh.read()):
                          die("%s has tag pinned cross repo git dependencies but no %s" % (lock_path, pins_path))
              sys.exit(0)

          declared = []
          seen = set()
          with open(pins_path, encoding="utf-8") as fh:
              for lineno, raw in enumerate(fh, start=1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if len(parts) != 2:
                      die("%s:%d expected `repository tag`, found %r" % (pins_path, lineno, line))
                  repo, tag = parts
                  key = repo_name(repo)
                  if key in seen:
                      die("%s:%d repository %s declared twice" % (pins_path, lineno, repo))
                  seen.add(key)
                  declared.append((repo, tag))

          if not declared:
              sys.exit(0)

          if not os.path.isfile(lock_path):
              die("%s declares pins but %s is missing" % (pins_path, lock_path))

          resolved = {}
          source_re = re.compile(r'source = "git\+([^"]+)"')
          with open(lock_path, encoding="utf-8") as fh:
              lock_text = fh.read()
          for m in source_re.finditer(lock_text):
              src = m.group(1)
              tag_m = re.search(r"[?&]tag=([^&#]+)", src)
              commit_m = re.search(r"#([0-9a-fA-F]{7,40})$", src)
              if not tag_m or not commit_m:
                  continue
              key = repo_name(src)
              entry = (tag_m.group(1), commit_m.group(1).lower())
              resolved.setdefault(key, set()).add(entry)

          peel_fixture = None
          if fixture_path is not None:
              peel_fixture = {}
              with open(fixture_path, encoding="utf-8") as fh:
                  for lineno, raw in enumerate(fh, start=1):
                      line = raw.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split()
                      if len(parts) != 3:
                          die("%s:%d expected `repository tag commit`" % (fixture_path, lineno))
                      repo, tag, commit = parts
                      peel_fixture[(repo_name(repo), tag)] = commit.lower()


          def peel_remote(declared_repo, tag):
              if peel_fixture is not None:
                  commit = peel_fixture.get((repo_name(declared_repo), tag))
                  if commit is None:
                      die("peel fixture has no entry for %s %s" % (declared_repo, tag))
                  return commit
              url = "https://github.com/%s.git" % owner_slug(declared_repo)
              out = subprocess.run(
                  ["git", "ls-remote", url, "refs/tags/%s" % tag, "refs/tags/%s^{}" % tag],
                  capture_output=True,
                  text=True,
              )
              if out.returncode != 0:
                  die("git ls-remote failed for %s %s: %s" % (declared_repo, tag, out.stderr.strip()))
              plain = None
              peeled = None
              for row in out.stdout.splitlines():
                  sha, _, ref = row.partition("\t")
                  if ref.endswith("^{}"):
                      peeled = sha.strip().lower()
                  elif ref:
                      plain = sha.strip().lower()
              commit = peeled or plain
              if commit is None:
                  die("remote has no tag %s in %s" % (tag, declared_repo))
              return commit


          def short(commit):
              return commit[:12] if commit else commit


          failures = 0
          for declared_repo, declared_tag in declared:
              key = repo_name(declared_repo)
              entries = resolved.get(key)
              if not entries:
                  sys.stderr.write(
                      "pin-agreement: %s: declared at %s but no git dependency on it is present in %s\n"
                      % (declared_repo, declared_tag, lock_path)
                  )
                  failures += 1
                  continue
              if len(entries) > 1:
                  joined = ", ".join("%s at %s" % (t, short(c)) for t, c in sorted(entries))
                  sys.stderr.write(
                      "pin-agreement: %s: lockfile resolves it to more than one pin: %s\n"
                      % (declared_repo, joined)
                  )
                  failures += 1
                  continue
              lock_tag, lock_commit = next(iter(entries))
              remote_commit = peel_remote(declared_repo, declared_tag)

              tag_ok = lock_tag == declared_tag
              commit_ok = lock_commit == remote_commit
              if tag_ok and commit_ok:
                  continue

              failures += 1
              if not tag_ok:
                  reason = "declared tag and lockfile tag disagree"
              else:
                  reason = "lockfile commit and remote peeled commit disagree"
              sys.stderr.write("pin-agreement: %s: %s\n" % (declared_repo, reason))
              sys.stderr.write("  declared tag:         %s\n" % declared_tag)
              sys.stderr.write("  lockfile tag:         %s\n" % lock_tag)
              sys.stderr.write("  lockfile commit:      %s\n" % lock_commit)
              sys.stderr.write("  remote peeled commit: %s\n" % remote_commit)

          sys.exit(1 if failures else 0)
          PY

  pins-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pin agreement self test
        if: ${{ hashFiles('fixtures/pin-agreement/agree/cross-repo-pins') != '' }}
        shell: bash
        run: bash scripts/pin-agreement-selftest.sh

  symbol-scan-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Symbol scan self test
        if: ${{ hashFiles('fixtures/symbol-scan/dirty/qtool') != '' }}
        shell: bash
        run: bash scripts/symbol-scan-selftest.sh

  fuzz-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: ${{ hashFiles('fixtures/fuzz/bridge-message-parsers/fuzz/fuzz_targets/airlock.rs') != '' }}
        with:
          toolchain: nightly
      - name: Install cargo fuzz
        if: ${{ hashFiles('fixtures/fuzz/bridge-message-parsers/fuzz/fuzz_targets/airlock.rs') != '' }}
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz gate self test
        if: ${{ hashFiles('fixtures/fuzz/bridge-message-parsers/fuzz/fuzz_targets/airlock.rs') != '' }}
        shell: bash
        run: bash scripts/fuzz-selftest.sh

  emoji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pictographic code point lint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess, sys, os

          def flagged(cp):
              return (
                  0x1F300 <= cp <= 0x1FAFF
                  or 0x2600 <= cp <= 0x27BF
                  or cp == 0xFE0F
                  or 0x2B00 <= cp <= 0x2BFF
                  or 0x2300 <= cp <= 0x23FF
              )

          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout
          paths = [p for p in out.split(b"\x00") if p]
          fail = 0
          for raw in paths:
              path = os.fsdecode(raw)
              if "hostile" in path.replace(os.sep, "/").split("/"):
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  continue
              if b"\x00" in blob:
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              line = 1
              for ch in text:
                  if ch == "\n":
                      line += 1
                      continue
                  cp = ord(ch)
                  if flagged(cp):
                      sys.stderr.write("%s:%d pictographic code point U+%04X\n" % (path, line, cp))
                      fail = 1
          sys.exit(1 if fail else 0)
          PY

  idfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Identifier format lint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess, sys, os, re

          pat = re.compile(r"0[xX][0-9A-Fa-f]{6,}")
          boundary = set(" \t([{,+*/%&|^~<>=")

          def comment_start(line):
              in_str = False
              esc = False
              i = 0
              n = len(line)
              while i < n - 1:
                  c = line[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                  else:
                      if c == '"':
                          in_str = True
                      elif c == "/" and line[i + 1] == "/":
                          return i
                  i += 1
              return n

          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout
          paths = [p for p in out.split(b"\x00") if p]
          fail = 0
          for raw in paths:
              path = os.fsdecode(raw)
              if "hostile" in path.replace(os.sep, "/").split("/"):
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  continue
              if b"\x00" in blob:
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              is_rs = path.endswith(".rs")
              for lineno, line in enumerate(text.split("\n"), start=1):
                  cpos = comment_start(line)
                  for m in pat.finditer(line):
                      start = m.start()
                      prev = line[start - 1] if start > 0 else ""
                      head = line[:start]
                      in_string = (head.count('"') - head.count('\\"')) % 2 == 1
                      bare = start == 0 or prev in boundary
                      permitted = is_rs and start < cpos and not in_string and bare
                      if permitted:
                          continue
                      sys.stderr.write("%s:%d Ethereum hex value %s\n" % (path, lineno, m.group(0)))
                      fail = 1
          sys.exit(1 if fail else 0)
          PY
