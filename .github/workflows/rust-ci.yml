name: rust-ci

# Reusable pipeline imported by every repo:
#   jobs:
#     ci:
#       uses: Quantova/Quantova-Ci/.github/workflows/rust-ci.yml@main
# No repo merges while this is red.

on:
  workflow_call:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust project
        id: guard
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      - name: fmt
        if: steps.guard.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        if: steps.guard.outputs.rust == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        if: steps.guard.outputs.rust == 'true'
        run: cargo test --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classical-crypto dependency gate
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  emoji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pictographic code point lint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess, sys, os

          def flagged(cp):
              return (
                  0x1F300 <= cp <= 0x1FAFF
                  or 0x2600 <= cp <= 0x27BF
                  or cp == 0xFE0F
                  or 0x2B00 <= cp <= 0x2BFF
                  or 0x2300 <= cp <= 0x23FF
              )

          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout
          paths = [p for p in out.split(b"\x00") if p]
          fail = 0
          for raw in paths:
              path = os.fsdecode(raw)
              if "hostile" in path.replace(os.sep, "/").split("/"):
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  continue
              if b"\x00" in blob:
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              line = 1
              for ch in text:
                  if ch == "\n":
                      line += 1
                      continue
                  cp = ord(ch)
                  if flagged(cp):
                      sys.stderr.write("%s:%d pictographic code point U+%04X\n" % (path, line, cp))
                      fail = 1
          sys.exit(1 if fail else 0)
          PY

  idfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identifier format lint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess, sys, os, re

          pat = re.compile(r"0[xX][0-9A-Fa-f]{6,}")
          boundary = set(" \t([{,+*/%&|^~<>=")

          def comment_start(line):
              in_str = False
              esc = False
              i = 0
              n = len(line)
              while i < n - 1:
                  c = line[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                  else:
                      if c == '"':
                          in_str = True
                      elif c == "/" and line[i + 1] == "/":
                          return i
                  i += 1
              return n

          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout
          paths = [p for p in out.split(b"\x00") if p]
          fail = 0
          for raw in paths:
              path = os.fsdecode(raw)
              if "hostile" in path.replace(os.sep, "/").split("/"):
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  continue
              if b"\x00" in blob:
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              is_rs = path.endswith(".rs")
              for lineno, line in enumerate(text.split("\n"), start=1):
                  cpos = comment_start(line)
                  for m in pat.finditer(line):
                      start = m.start()
                      prev = line[start - 1] if start > 0 else ""
                      head = line[:start]
                      in_string = (head.count('"') - head.count('\\"')) % 2 == 1
                      bare = start == 0 or prev in boundary
                      permitted = is_rs and start < cpos and not in_string and bare
                      if permitted:
                          continue
                      sys.stderr.write("%s:%d Ethereum hex value %s\n" % (path, lineno, m.group(0)))
                      fail = 1
          sys.exit(1 if fail else 0)
          PY
