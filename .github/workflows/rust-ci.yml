name: rust-ci

on:
  workflow_call:
    inputs:
      release-features:
        type: string
        required: false
        default: "--all-features"
      rust:
        type: string
        required: false
        default: "auto"
      deny-unsafe-code:
        type: boolean
        required: false
        default: false
      deny-float-arithmetic:
        type: boolean
        required: false
        default: false
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Detect Rust project
        id: guard
        env:
          RUST_INPUT: ${{ inputs.rust }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$RUST_INPUT" = "false" ] || [ "$REPO" = "Quantova/Quantova-Ci" ]; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          elif [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-files '*Cargo.toml')" ]; then
            echo "this repository has crates but no root Cargo.toml, so nothing would be built or tested; add a root workspace or pass rust: false" >&2
            exit 1
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: steps.guard.outputs.rust == 'true'
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        if: steps.guard.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings and leftover debug macros)
        if: steps.guard.outputs.rust == 'true'
        env:
          DENY_UNSAFE: ${{ inputs.deny-unsafe-code }}
          DENY_FLOAT: ${{ inputs.deny-float-arithmetic }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$DENY_UNSAFE" = "true" ]; then extra+=(-D unsafe_code); fi
          if [ "$DENY_FLOAT" = "true" ]; then extra+=(-D clippy::float_arithmetic); fi
          cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::dbg_macro -D clippy::todo -D clippy::unimplemented ${extra[@]+"${extra[@]}"}
      - name: panic and arithmetic lints (advisory, reported as a warning)
        if: steps.guard.outputs.rust == 'true'
        continue-on-error: true
        run: cargo clippy --locked --lib --bins --all-features -- -D clippy::indexing_slicing -D clippy::arithmetic_side_effects -A clippy::all
      - name: test
        if: steps.guard.outputs.rust == 'true'
        run: cargo test --locked --all-features

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Detect Rust project
        id: guard
        env:
          RUST_INPUT: ${{ inputs.rust }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$RUST_INPUT" = "false" ] || [ "$REPO" = "Quantova/Quantova-Ci" ]; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          elif [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-files '*Cargo.toml')" ]; then
            echo "this repository has crates but no root Cargo.toml, so nothing would be built or tested; add a root workspace or pass rust: false" >&2
            exit 1
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: steps.guard.outputs.rust == 'true'
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - name: Install cargo llvm-cov
        if: steps.guard.outputs.rust == 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Coverage gate
        if: steps.guard.outputs.rust == 'true'
        run: cargo llvm-cov --locked --all-features --workspace --fail-under-lines 70

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Classical-crypto dependency gate
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check bans licenses sources advisories

  symbol-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: ${{ hashFiles('Cargo.toml') != '' }}
        with:
          toolchain: 1.98.0
      - name: Build release
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          RELEASE_FEATURES: ${{ inputs.release-features }}
        run: cargo build --locked --release $RELEASE_FEATURES
      - name: Classical-crypto symbol scan
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          bash -s -- target/release <<'SH'
          set -euo pipefail
          dir="$1"
          names='secp256k1|secp256r1|secp384r1|curve25519|x25519|ristretto|ed25519|ed448|x448|ecdsa|p256|p384|p521|k256|nistp|bls12|bn254'
          symbols='EC_POINT|BN_mod_exp|RSA_|3rsa[0-9A-Z_]'
          fail=0
          count=0
          while IFS= read -r -d '' artifact; do
            count=$((count + 1))
            if strings -a "$artifact" | grep -Eiq "$names" || strings -a "$artifact" | grep -Eq "$symbols"; then
              echo "::error file=$artifact::classical-crypto symbol signature detected in $artifact" >&2
              fail=1
            fi
          done < <(
            find "$dir" -maxdepth 1 -type f \( -perm -u+x -o -name 'lib*.rlib' -o -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.wasm' \) -print0 2>/dev/null
            find "$dir/deps" -maxdepth 1 -type f -name 'lib*.rlib' -print0 2>/dev/null
            find "$(dirname "$dir")" -mindepth 3 -maxdepth 3 -type f -path "$(dirname "$dir")/*/release/*.wasm" -print0 2>/dev/null
          )
          if [ "$count" = "0" ]; then
            echo "::error::no release artifact found in $dir, nothing was scanned" >&2
            exit 1
          fi
          echo "scanned $count release artifacts in $dir"
          exit "$fail"
          SH

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gl.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scan over full history
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gitleaks.toml <<'TOML'
          title = "quantova secret scan"
          [extend]
          useDefault = true
          [allowlist]
          description = "public, example, and checksum data that is not a secret"
          paths = [
            '''(^|/)Cargo\.lock$''',
            '''(^|/)package-lock\.json$''',
            '''(^|/)Podfile\.lock$''',
            '''\.cargo-checksum\.json$''',
          ]
          regexes = [
            '''YOUR_[A-Z0-9_]+''',
            '''^[Qq]1[0-9A-Za-z]{25,}$''',
            '''Bearer YOUR_ACCESS_TOKEN''',
            '''q(mask|tov)\.[a-z0-9._]+''',
          ]
          TOML
          gitleaks detect --source . --no-banner --redact --config /tmp/gitleaks.toml

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Cross repo pin agreement gate
        shell: bash
        env:
          QTOV_PINS_FILE: cross-repo-pins
          QTOV_LOCK_FILE: Cargo.lock
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, re, subprocess, sys

          pins_path = os.environ["QTOV_PINS_FILE"]
          lock_path = os.environ["QTOV_LOCK_FILE"]
          repo_root = os.environ.get("QTOV_REPO_ROOT") or "."
          fixture_path = os.environ.get("QTOV_PIN_PEEL_FIXTURE")

          DEFAULT_OWNER = "Quantova"
          COMMIT_RE = re.compile(r"^[0-9a-f]{40}$")
          HEX_RE = re.compile(r"^[0-9a-fA-F]+$")

          failures = 0

          def die(msg):
              sys.stderr.write("pin-agreement: %s\n" % msg)
              sys.exit(1)

          def fail(msg):
              global failures
              sys.stderr.write("pin-agreement: %s\n" % msg)
              failures += 1

          def repo_name(value):
              value = value.strip()
              value = re.sub(r"^git\+", "", value)
              value = value.split("#", 1)[0]
              value = value.split("?", 1)[0]
              value = re.sub(r"\.git$", "", value.rstrip("/"))
              return value.rstrip("/").rsplit("/", 1)[-1].lower()

          def owner_slug(declared_repo):
              declared_repo = declared_repo.strip().rstrip("/")
              if "/" in declared_repo:
                  return declared_repo
              return "%s/%s" % (DEFAULT_OWNER, declared_repo)

          def short(commit):
              return commit[:12] if commit else commit

          def parse_source(src):
              base, _, commit = src.partition("#")
              query = base.split("?", 1)[1] if "?" in base else ""
              params = {}
              for item in query.split("&"):
                  if "=" in item:
                      k, v = item.split("=", 1)
                      params[k] = v
              return {
                  "source": src,
                  "repo": repo_name(src),
                  "tag": params.get("tag"),
                  "rev": params.get("rev"),
                  "branch": params.get("branch"),
                  "commit": commit.lower(),
              }

          lock_sources = []
          if os.path.isfile(lock_path):
              with open(lock_path, encoding="utf-8") as fh:
                  lock_text = fh.read()
              for m in re.finditer(r'source = "git\+([^"]+)"', lock_text):
                  lock_sources.append(parse_source(m.group(1)))

          unique_sources = {}
          for entry in lock_sources:
              unique_sources.setdefault(entry["source"], entry)

          for entry in unique_sources.values():
              if not COMMIT_RE.match(entry["commit"]):
                  fail("%s: git source %s does not resolve to a full commit" % (entry["repo"], entry["source"]))
                  continue
              if entry["tag"]:
                  continue
              rev = entry["rev"]
              if rev and HEX_RE.match(rev) and 7 <= len(rev) <= 40 and entry["commit"].startswith(rev.lower()):
                  continue
              if rev:
                  fail("%s: git source %s pins rev=%s which is not a commit prefix of the resolved commit" % (entry["repo"], entry["source"], rev))
              elif entry["branch"]:
                  fail("%s: git source %s follows branch %s and is unpinned" % (entry["repo"], entry["source"], entry["branch"]))
              else:
                  fail("%s: git source %s names no rev or tag and is unpinned" % (entry["repo"], entry["source"]))

          commits_by_repo = {}
          for entry in lock_sources:
              commits_by_repo.setdefault(entry["repo"], set()).add(entry["commit"])
          for repo, commits in sorted(commits_by_repo.items()):
              if len(commits) > 1:
                  fail("%s: lockfile resolves it to more than one commit: %s" % (repo, ", ".join(short(c) for c in sorted(commits))))

          def manifest_paths():
              out = subprocess.run(
                  ["git", "ls-files", "-co", "--exclude-standard", "-z", "--", "*Cargo.toml"],
                  cwd=repo_root,
                  capture_output=True,
              )
              if out.returncode == 0:
                  return sorted(os.fsdecode(p) for p in out.stdout.split(b"\x00") if p and os.path.basename(os.fsdecode(p)) == "Cargo.toml")
              found = []
              for base, dirs, files in os.walk(repo_root):
                  dirs[:] = [d for d in dirs if d not in (".git", "target", "node_modules")]
                  if "Cargo.toml" in files:
                      found.append(os.path.relpath(os.path.join(base, "Cargo.toml"), repo_root))
              return sorted(found)

          def declared_paths(text):
              try:
                  import tomllib
                  doc = tomllib.loads(text)
              except Exception:
                  return [m.group(1) or m.group(2) for m in re.finditer(r"""(?m)^[^#\n]*?\bpath\s*=\s*(?:"([^"]*)"|'([^']*)')""", text)]
              found = []
              stack = [doc]
              while stack:
                  node = stack.pop()
                  if isinstance(node, dict):
                      value = node.get("path")
                      if isinstance(value, str):
                          found.append(value)
                      stack.extend(node.values())
                  elif isinstance(node, list):
                      stack.extend(node)
              return found

          root_abs = os.path.realpath(repo_root)
          external_paths = []
          for manifest in manifest_paths():
              full = os.path.join(root_abs, manifest)
              try:
                  with open(full, encoding="utf-8") as fh:
                      text = fh.read()
              except OSError:
                  continue
              for value in declared_paths(text):
                  target = os.path.realpath(os.path.join(os.path.dirname(full), value))
                  rel = os.path.relpath(target, root_abs)
                  parts = rel.replace(os.sep, "/").split("/")
                  if parts[0] != "..":
                      continue
                  outside = [p for p in parts if p != ".."]
                  key = (outside[0] if outside else os.path.basename(target)).lower()
                  external_paths.append((manifest, value, key))

          if not os.path.isfile(pins_path):
              tagged = sorted({e["repo"] for e in lock_sources if e["tag"]})
              if tagged:
                  fail("%s has tag pinned cross repo git dependencies (%s) but no %s" % (lock_path, ", ".join(tagged), pins_path))
              for manifest, value, key in external_paths:
                  fail("%s: path dependency %s leaves the repository but there is no %s to pin %s" % (manifest, value, pins_path, key))
              sys.exit(1 if failures else 0)

          declared = []
          seen = set()
          with open(pins_path, encoding="utf-8") as fh:
              for lineno, raw in enumerate(fh, start=1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if len(parts) != 2:
                      die("%s:%d expected `repository tag` or `repository commit`, found %r" % (pins_path, lineno, line))
                  repo, pin = parts
                  if HEX_RE.match(pin) and len(pin) != 40:
                      die("%s:%d %s is pinned to %s, a commit pin must be the full 40 hex commit" % (pins_path, lineno, repo, pin))
                  key = repo_name(repo)
                  if key in seen:
                      die("%s:%d repository %s declared twice" % (pins_path, lineno, repo))
                  seen.add(key)
                  declared.append((repo, pin))

          for manifest, value, key in external_paths:
              if key not in seen:
                  fail("%s: path dependency %s leaves the repository and %s is not declared in %s" % (manifest, value, key, pins_path))

          for repo in sorted({e["repo"] for e in lock_sources if e["tag"]}):
              if repo not in seen:
                  fail("%s: tag pinned git source is not declared in %s" % (repo, pins_path))

          if not declared:
              sys.exit(1 if failures else 0)

          if not os.path.isfile(lock_path) and not external_paths:
              die("%s declares pins but %s is missing" % (pins_path, lock_path))

          peel_fixture = None
          if fixture_path is not None:
              peel_fixture = {}
              with open(fixture_path, encoding="utf-8") as fh:
                  for lineno, raw in enumerate(fh, start=1):
                      line = raw.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split()
                      if len(parts) != 3:
                          die("%s:%d expected `repository tag commit`" % (fixture_path, lineno))
                      repo, tag, commit = parts
                      peel_fixture[(repo_name(repo), tag)] = commit.lower()

          def peel_remote(declared_repo, tag):
              if peel_fixture is not None:
                  commit = peel_fixture.get((repo_name(declared_repo), tag))
                  if commit is None:
                      die("peel fixture has no entry for %s %s" % (declared_repo, tag))
                  return commit
              url = "https://github.com/%s.git" % owner_slug(declared_repo)
              out = subprocess.run(
                  ["git", "ls-remote", url, "refs/tags/%s" % tag, "refs/tags/%s^{}" % tag],
                  capture_output=True,
                  text=True,
              )
              if out.returncode != 0:
                  die("git ls-remote failed for %s %s: %s" % (declared_repo, tag, out.stderr.strip()))
              plain = None
              peeled = None
              for row in out.stdout.splitlines():
                  sha, _, ref = row.partition("\t")
                  if ref.endswith("^{}"):
                      peeled = sha.strip().lower()
                  elif ref:
                      plain = sha.strip().lower()
              commit = peeled or plain
              if commit is None:
                  die("remote has no tag %s in %s" % (tag, declared_repo))
              return commit

          path_keys = {key for _, _, key in external_paths}

          for declared_repo, pin in declared:
              key = repo_name(declared_repo)
              entries = [e for e in lock_sources if e["repo"] == key]
              if not entries:
                  if key in path_keys:
                      continue
                  fail("%s: declared at %s but no git or path dependency on it is present" % (declared_repo, pin))
                  continue
              if COMMIT_RE.match(pin.lower()):
                  want = pin.lower()
                  for entry in {e["source"]: e for e in entries}.values():
                      if entry["commit"] != want:
                          fail("%s: declared commit and lockfile commit disagree" % declared_repo)
                          sys.stderr.write("  declared commit:  %s\n" % want)
                          sys.stderr.write("  lockfile source:  %s\n" % entry["source"])
                          sys.stderr.write("  lockfile commit:  %s\n" % entry["commit"])
                  continue
              tags = sorted({e["tag"] or "" for e in entries})
              commits = sorted({e["commit"] for e in entries})
              if tags != [pin]:
                  fail("%s: declared tag and lockfile tag disagree" % declared_repo)
                  sys.stderr.write("  declared tag:     %s\n" % pin)
                  sys.stderr.write("  lockfile tags:    %s\n" % ", ".join(t or "(none)" for t in tags))
                  continue
              if len(commits) != 1:
                  continue
              remote_commit = peel_remote(declared_repo, pin)
              if commits[0] != remote_commit:
                  fail("%s: lockfile commit and remote peeled commit disagree" % declared_repo)
                  sys.stderr.write("  declared tag:         %s\n" % pin)
                  sys.stderr.write("  lockfile tag:         %s\n" % pin)
                  sys.stderr.write("  lockfile commit:      %s\n" % commits[0])
                  sys.stderr.write("  remote peeled commit: %s\n" % remote_commit)

          sys.exit(1 if failures else 0)
          PY

  inline-copies:
    if: github.repository == 'Quantova/Quantova-Ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inline workflow copies match the scripts
        shell: bash
        run: bash scripts/inline-copy-check.sh

  pins-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin agreement self test
        if: ${{ hashFiles('fixtures/pin-agreement/agree/cross-repo-pins') != '' }}
        shell: bash
        run: bash scripts/pin-agreement-selftest.sh

  symbol-scan-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Symbol scan self test
        if: ${{ hashFiles('fixtures/symbol-scan/dirty/qtool') != '' }}
        shell: bash
        run: bash scripts/symbol-scan-selftest.sh

  fuzz-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: ${{ hashFiles('fixtures/fuzz/bridge-message-parsers/fuzz/fuzz_targets/airlock.rs') != '' }}
        with:
          toolchain: nightly-2026-10-15
      - name: Install cargo fuzz
        if: ${{ hashFiles('fixtures/fuzz/bridge-message-parsers/fuzz/fuzz_targets/airlock.rs') != '' }}
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz gate self test
        if: ${{ hashFiles('fixtures/fuzz/bridge-message-parsers/fuzz/fuzz_targets/airlock.rs') != '' }}
        shell: bash
        run: bash scripts/fuzz-selftest.sh

  emoji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pictographic code point lint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess, sys, os

          def flagged(cp):
              return (
                  0x1F300 <= cp <= 0x1FAFF
                  or 0x2600 <= cp <= 0x27BF
                  or cp == 0xFE0F
                  or 0x2B00 <= cp <= 0x2BFF
                  or 0x2300 <= cp <= 0x23FF
              )

          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout
          paths = [p for p in out.split(b"\x00") if p]
          fail = 0
          for raw in paths:
              path = os.fsdecode(raw)
              if "hostile" in path.replace(os.sep, "/").split("/"):
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  continue
              if b"\x00" in blob:
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              line = 1
              for ch in text:
                  if ch == "\n":
                      line += 1
                      continue
                  cp = ord(ch)
                  if flagged(cp):
                      sys.stderr.write("%s:%d pictographic code point U+%04X\n" % (path, line, cp))
                      fail = 1
          sys.exit(1 if fail else 0)
          PY

  idfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identifier format lint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess, sys, os, re

          pat = re.compile(r"0[xX][0-9A-Fa-f]{6,}")
          boundary = set(" \t([{,+*/%&|^~<>=")

          def comment_start(line):
              in_str = False
              esc = False
              i = 0
              n = len(line)
              while i < n - 1:
                  c = line[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                  else:
                      if c == '"':
                          in_str = True
                      elif c == "/" and line[i + 1] == "/":
                          return i
                  i += 1
              return n

          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout
          paths = [p for p in out.split(b"\x00") if p]
          fail = 0
          for raw in paths:
              path = os.fsdecode(raw)
              if "hostile" in path.replace(os.sep, "/").split("/"):
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  continue
              if b"\x00" in blob:
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              is_rs = path.endswith(".rs")
              for lineno, line in enumerate(text.split("\n"), start=1):
                  cpos = comment_start(line)
                  for m in pat.finditer(line):
                      start = m.start()
                      prev = line[start - 1] if start > 0 else ""
                      head = line[:start]
                      in_string = (head.count('"') - head.count('\\"')) % 2 == 1
                      bare = start == 0 or prev in boundary
                      permitted = is_rs and start < cpos and not in_string and bare
                      if permitted:
                          continue
                      sys.stderr.write("%s:%d Ethereum hex value %s\n" % (path, lineno, m.group(0)))
                      fail = 1
          sys.exit(1 if fail else 0)
          PY
